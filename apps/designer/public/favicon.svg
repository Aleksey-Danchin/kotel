<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#316578"></circle>

  <!-- 1) Cauldron body -->
  <ellipse cx="32" cy="38" rx="20" ry="14" fill="#05070b"></ellipse>

  <!-- 2) Legs -->
  <rect x="16" y="46" width="4" height="8" rx="2" fill="#05070b" transform="rotate(10 18 51)"></rect>
  <rect x="30" y="50" width="4" height="6" rx="2" fill="#05070b"></rect>
  <rect x="44" y="46" width="4" height="8" rx="2" fill="#05070b" transform="rotate(-10 46 51)"></rect>

  <!-- 3) Rim top half -->
  <path d="M13 26 A19 6 0 0 1 51 26" fill="none" stroke="#05070b" stroke-width="3"></path>

  <!-- 4) Liquid top half -->
  <path d="M14 26 A18 5 0 0 1 50 26 L14 26 Z" fill="#22c55e"></path>

  <!-- 5) Envelope (raised a bit) -->
  <g transform="rotate(-25 32 23)">
    <rect x="24" y="17" width="16" height="10" rx="2" fill="#f3f4f6"></rect>
    <path d="M24 17 L32 23 L40 17" fill="none" stroke="#9ca3af" stroke-width="1.5"></path>
  </g>

  <!-- 6) Rim bottom half -->
  <path d="M13 26 A19 6 0 0 0 51 26" fill="none" stroke="#05070b" stroke-width="3"></path>

  <!-- 7) Liquid bottom half -->
  <path d="M14 26 A18 5 0 0 0 50 26 L14 25.6 Z" fill="#22c55e"></path>

  <!-- 8) Drips -->
  <path d="M38 27 C38 32, 41 32, 41 27 Z" fill="#22c55e"></path>
  <path d="M45 27 C45 38, 47 38, 47 27 Z" fill="#22c55e"></path>
</svg>